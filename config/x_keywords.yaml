# =====================================================================
# config/x_keywords.yaml — X (Twitter) Stage-1 keyword/regex filter
# =====================================================================
#
# Purpose:
#   Sending every X post directly to GPT-5.4 wastes cost and latency, so
#   a fast keyword + regex filter first selects "posts that look possibly
#   trading-relevant" and passes only those to the LLM (Stage 2).
#
# How matching works:
#   We compute a score for each post:
#
#     score = (ticker_score + case_score + common_score + regex_score)
#             × account_multiplier
#             × (0 if irrelevant else 1)
#
#   If score >= stage1_filter_config.llm_threshold, the LLM is invoked.
#
#   Note: each category (e.g. case_keywords) contributes its weight at
#   most once, even when several keywords inside it match. This prevents
#   long posts from passing automatically.
#
# Matching rules:
#   - All keywords are matched case-insensitively (compared in lowercase).
#   - **Word-boundary matching** is used (Python `\b...\b`).
#       e.g. searching for "short":
#         match     "BTC short", "is short", "short position"
#         no match  "shortage", "shortly", "short-term"
#         no match  "shorts", "shorted"  → plural / tense variants must
#                                           be listed explicitly.
#   - Phrase keywords (e.g. "opened short") match the literal spacing.
#   - regex_patterns use Python `re` syntax, compiled with IGNORECASE.
#
# Six-case reference (the insider-trading events used as the case study):
#   1. 2025-04-09  Liberation Day SPY options ($24M put spread)
#   2. 2025-10-10  Trump China 100% tariff / Hyperliquid BTC-ETH short ($1.1B)
#   3. 2026-01-03  Maduro capture / Polymarket ($32K → $436K)
#   4. 2026-02-28  Iran first strike / Polymarket ($500M+, Magamyman)
#   5. 2026-03-23  Trump Truth Social Iran delay / oil short ($580M, 16 min before)
#   6. 2026-04-17  Iran Hormuz open / Brent short ($760M, 20 min before)
#
# How to edit:
#   - Add or remove keywords freely. Restart the daemon to apply
#     (Cloud Run = image rebuild).
#   - When a new event occurs, add a new group under `case_keywords`.
#   - The multiplier in account_priority is a scaling factor (1.0 = no change).
#   - All keywords are matched case-insensitively (compared in lowercase).
#   - regex_patterns use Python `re` syntax.
#
# Plan: P9.4 (X channel LLM upgrade), architecture §5.4.1 channel tier
# =====================================================================


version: "1.0"
last_updated: "2026-04-19"


# ─────────────────────────────────────────────────────────────────────
# Stage-1 filter configuration — score threshold and category weights.
# ─────────────────────────────────────────────────────────────────────
stage1_filter_config:
  # ─────────────────────────────────────────────────────────────────
  # Scoring system explanation:
  #
  #   This is a "score" system, not a normalized "probability"
  #   (the sum is not constrained to 1).
  #   Each category contributes a "this is how suspicious it is" score,
  #   and the scores are summed.
  #
  #   Categories are split into two groups:
  #
  #     Prerequisite layer (asset identification)
  #       ticker_match: 0.20  ← bonus: "what asset is this post about?"
  #
  #     Signal layer (insider patterns)
  #       case_keyword:   0.40  ← case-specific keywords from the 6 events
  #       common_signal:  0.30  ← timing / wallet / size common signals
  #       regex:          0.30  ← USD amounts, timestamps, contract counts
  #       ───────────────────
  #       max signal = 1.00     ← signals alone can score up to 1.00
  #
  #   Score range:
  #     - min   = 0.00  (no category matched, or irrelevant filter ×0)
  #     - max   = 1.20  (ticker + all signals: 0.20+0.40+0.30+0.30)
  #     - final = up to 1.44  (× max account_multiplier 1.20)
  #
  #   → It is fine for the sum to exceed 1.0; this is not a normalized
  #     probability.
  #
  #   Design rationale:
  #     - A post without a ticker is unlikely to be a real trading post,
  #       so ticker_match acts as the default entry bonus.
  #     - But we do NOT hard-reject ticker-less posts (rare edge case
  #       preservation): a post with all three signals strongly present
  #       can still pass even without a ticker.
  #
  #   Each category contributes its weight at most ONCE per post (long
  #   posts cannot pass automatically by matching many synonyms).
  # ─────────────────────────────────────────────────────────────────
  weights:
    ticker_match: 0.20         # asset/instrument mention (BTC, oil, ...) — prerequisite bonus
    case_keyword_match: 0.40   # case-specific keywords (strongest signal)
    common_signal_match: 0.30  # cross-event common signals (timing, wallet behavior)
    regex_match: 0.30          # structured patterns (USD amount, contracts, ...)

  # LLM (Stage 2) invocation threshold.
  # Too high → false negatives (we miss insider posts).
  # Too low  → LLM cost grows (false positives).
  #
  # 0.80 means:
  #   - ticker (0.20) + two strong signal categories (0.60) = 0.80 → pass
  #   - ticker (0.20) + one signal category only (0.30-0.40) = fail
  #   - no ticker + all three signal categories match (1.00) = pass (rare but valid)
  #   - i.e. "asset mention + strong patterns" or "very strong patterns alone" pass.
  llm_threshold: 0.80

  # Time to cache LLM responses (avoid re-processing the same post).
  cache_ttl_seconds: 3600


