# ─────────────────────────────────────────────────────────────────────
# Regex patterns — structured matching (numbers, times, addresses).
# Python `re` syntax. Compiled case-insensitively.
# ─────────────────────────────────────────────────────────────────────
regex_patterns:

  # USD amount: $XXXM, $X.XB, $XXX,XXX, $XX million, ...
  usd_amount: '\$\d{1,3}(?:[,.]?\d{3})*(?:\.\d+)?\s*(?:k|m|b|million|billion|thousand)?'

  # Contracts / lots / barrels — large counts
  contracts_count: '\b\d{1,3}(?:,\d{3})+\s*(?:contracts?|lots?|barrels?|positions?|accounts?|wallets?)\b'

  # Time-before expressions: "X minutes/hours before"
  time_before: '\b\d+\s*(?:min|mins|minute|minutes|hr|hrs|hour|hours)\s*(?:before|prior to|ahead of)\b'

  # Exact times (UTC, GMT, ET, PT, ...)
  exact_time: '\b\d{1,2}:\d{2}\s*(?:am|pm|utc|gmt|est|edt|pst|pdt|et|pt|ct|cst)\b'

  # Percentage / multiplier changes (e.g. "11% drop", "10x", "5.38x leverage")
  percentage_change: '\b\d+(?:\.\d+)?\s*%(?:\s*(?:drop|fall|crash|surge|jump|gain|rise))?'
  leverage_multiplier: '\b\d+(?:\.\d+)?\s*x\s*(?:leverage|leveraged|short|long)\b'

  # Ethereum / EVM wallet address (40-hex starting with 0x, or shorter prefix form)
  eth_wallet_address: '\b0x[a-fA-F0-9]{4,40}\b'

  # Large number + crypto unit (e.g. "86,000 BTC", "200,687 BRENTOIL")
  crypto_quantity: '\b\d{1,3}(?:,\d{3})+\s*(?:btc|eth|sol|xrp|doge|hype|usdc|usdt|brentoil)\b'


# ─────────────────────────────────────────────────────────────────────
# Account priority — per-account score multiplier.
# (Separate from credibility.py; this multiplier is for the Stage-1 filter.)
# 1.0 = no change / >1.0 = more likely to pass / <1.0 = less likely.
# ─────────────────────────────────────────────────────────────────────
account_priority:
  # Tier-A: verified on-chain analysts (low false positives).
  lookonchain: 1.20
  mlmabc: 1.20         # P9.4 addition — discoverer of the Hyperliquid whale

  # Tier-B: automated detection bots (raw alerts, occasional noise).
  whalealert: 1.00
  unusual_whales: 1.10
  unusualwhales: 1.10  # alias

  # Tier-C: curation / visualization (mostly post-event analysis).
  polymarkethistory: 1.05
  bubblemaps: 0.95     # wallet cluster visualization — useful but post-event

  # Unknown accounts default to 1.0 (handled in code).


# ─────────────────────────────────────────────────────────────────────
# Irrelevant filters — early reject (multiply final score by 0).
# Obvious non-trading noise is blocked before the LLM is called.
# ─────────────────────────────────────────────────────────────────────
