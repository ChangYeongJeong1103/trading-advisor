# =====================================================================
# config/watchlist.yaml — D10 symbols universe
# =====================================================================
# Edit this file and restart the daemon to apply a new watchlist.
# (v1 has no hot-reload — restart is required. To be revisited in v2.)
#
# Add or remove freely, but keep the per-channel identifier format.
# =====================================================================


# ─────────────────────────────────────────────────────────────────────
# Polymarket — market slug or condition_id.
# (the <slug> in polymarket.com/market/<slug>)
# ─────────────────────────────────────────────────────────────────────
polymarket_markets:
  # ── geopolitical / Iran · oil — short-term (November 30 expiry) ──
  - "us-x-iran-ceasefire-continues-through-november-30-20260918"                 # ~$27k/24h, U.S.–Iran ceasefire durability (YES ~40%)
  - "us-announces-end-of-iranian-blockade-by-november-30-2026"                   # ~$272k/24h, end of U.S. blockade

  # ── geopolitical / Iran · oil — December 31 expiry ──
  # The November 30 Hormuz market is thin (~$16k/24h), so the December 31 market is used instead.
  - "strait-of-hormuz-traffic-returns-to-normal-by-december-31"                  # ~$75k/24h, direct oil exposure

  # ── geopolitical / Iran — long-term baseline ──
  - "will-the-us-invade-iran-before-2027"                       # ~$125k/24h, long-term military-escalation gauge

  # ── macro / Fed — December FOMC (Dec 9 meeting; no FOMC in November) ──
  - "will-the-fed-increase-interest-rates-by-25-bps-after-the-december-2026-meeting-20260729232808636" # ~$499k/24h

  # NOTE: expired slugs are silently skipped by the daemon (logging.debug).
  #       Edit this watchlist freely → restart the daemon to apply
  #       (Cloud Run requires an image rebuild).


# ─────────────────────────────────────────────────────────────────────
# Hyperliquid — asset name (BTC, ETH, ...; the perp contract is implicit).
# ─────────────────────────────────────────────────────────────────────
hyperliquid_assets:
  - "BTC"
  - "ETH"
  - "SOL"   # P9.2.P2 — expand new_whale_v1 detector coverage (3-coin baseline)
  # - "ARB"


# ─────────────────────────────────────────────────────────────────────
# CME futures — root symbol
#   CL = WTI Crude Oil (NYMEX)
#   BZ = Brent Crude Oil (CME's Brent — proxy for ICE Brent spillover)
#   GC = Gold (COMEX)
#   ES = E-mini S&P 500 (CME)
#   NQ = E-mini Nasdaq 100
#   ZB = US Treasury Bond
#   6E = EUR/USD
# ─────────────────────────────────────────────────────────────────────
# P9.3 (CME detector v2): we watch 4 symbols, covering Trump statements,
# Middle East events, and macro releases.
# - CL + BZ: oil events such as 4/17 Iran-Brent (BZ also catches Brent-led moves).
# - ES:      equity-wide events such as 4/2 Liberation Day or 4/9 Truth Social.
# - GC:      risk-off / safe-haven flow (war fear, inflation surprise).
cme_symbols:
  - "CL"   # WTI — most sensitive to Trump Middle East statements and OPEC decisions
  - "BZ"   # Brent (CME) — spillover proxy for ICE-Brent-led events like 4/17
  - "GC"   # Gold — risk-off hedge (Iran / war signals)
  - "ES"   # S&P futures — broad market (Trump tariffs, Fed surprises)
  # - "NQ"
  # - "ZB"


# ─────────────────────────────────────────────────────────────────────
# X (Twitter) — handles (without the leading @).
# Automated anomaly-detection accounts. We use their output only as
# corroboration for our own detectors.
#
# Selection criteria (decided 2026-05-04):
#   1) Cover an area that our raw-data channels (Polymarket / Hyperliquid /
#      CME) cannot see directly.
#   2) Provide curated / human-interpreted information such as options flow.
#   3) Use a "trade alert" style that an LLM classifier can parse easily.
#
# X PAYG cost — $0.005 per read. Polling every 10 minutes; only new posts
# are fetched via since_id.
#   · Lookonchain    : ~15 posts/day → ~$2.25 / month
#   · unusual_whales : ~40 posts/day → ~$6 / month
#   = total ~$8.25 / month
#
# Accounts considered but excluded (reason):
#   · WhaleAlert        — mostly exchange hot/cold shuffles (low signal/noise)
#                         and BTC/ETH overlap with the Hyperliquid channel; expensive.
#   · PolymarketHistory — the Polymarket channel already sees every raw trade
#                         (redundant).
#   · Bubblemaps        — no actionable signal (mostly visualization).
#   · @DeItaone / @zerohedge / @arkham — macro/narrative yes, insider signal no.
#   · @SpotGamma        — has insider relevance but is analysis-style (hard for
#                         the LLM to parse) and overlaps with unusual_whales on
#                         options flow. Revisit in v2.
# ─────────────────────────────────────────────────────────────────────
x_accounts:
  - "Lookonchain"          # curated on-chain whale narratives
  - "unusual_whales"       # options flow / dark pool — zero coverage elsewhere


# ─────────────────────────────────────────────────────────────────────
# Truth Social (Channel 5, Step 3 — Trump only, v1)
# ─────────────────────────────────────────────────────────────────────
# Step 3 pipeline:
#   collector (5-minute polling) → ReferenceDB hybrid retrieval (keyword + embedding)
#   → GPT-5.4 scorer → ChannelSignal (NORMAL / WATCH / RISK_OFF / EMERGENCY)
#
# Cost estimate: ~$0.005 per post (input 3-5K tokens + output 500 tokens).
#   · Average Trump posts/day = 10-30 → daily $0.05-0.15
#   · Monthly ~$3-5 (similar to the X channel)
#
# v1 watches a single account (realDonaldTrump). Multi-account support is
# planned as a v2 follow-up.
# ─────────────────────────────────────────────────────────────────────
truth_social_accounts:
  - "realDonaldTrump"
