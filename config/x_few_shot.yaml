      image_description: "Bubblemaps cluster diagram — 5 connected nodes
        with funding flows from single root wallet, total volume $500M+,
        all betting same outcome."
    expected_output:
      tier: "RISK_OFF"
      confidence: 0.90
      direction: "BUY"
      symbols: ["POLYMARKET"]
      key_signals:
        - "wallet cluster coordination (5 wallets, same funding source)"
        - "size $500M+ across cluster"
        - "5 days pre-event positioning"
        - "low implied probability (12%) — high payoff"
        - "93% success rate (statistical anomaly)"
        - "named pattern (Magamyman wallet splitting)"
      matched_case: "2026.02.28_iran_first_strike_polymarket"
      reasoning: |
        Five wallets funded from a single source loaded up $500M+ of YES
        bets on the Iran strike market five days before the event, at a
        12% implied probability — and 93% of them profited. This is not
        a lone whale but a coordinated insider cluster, and Bubblemaps's
