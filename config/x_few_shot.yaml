        moving averages aligned upward."
    expected_output:
      tier: "NORMAL"
      confidence: 0.15
      direction: "BUY"
      symbols: ["BTC"]
      key_signals:
        - "generic technical analysis (resistance break)"
        - "no insider trading patterns (no timing/wallet/coordination)"
        - "no specific event reference"
      matched_case: null
      reasoning: |
        Generic chart-based bullish commentary. Keywords like "massive",
        "loading up", and "calls" trigger the filter, but none of the
        insider-trading signal dimensions (timing / fresh wallet /
        coordination / event correlation) are present. Retail/technical
        noise.
      is_pre_event: false
      recommend_action: null

