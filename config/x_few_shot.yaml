  # ═════════════════════════════════════════════════════════════════
  - case_id: negative_generic_btc_bullish
    label: negative
    input:
      account: "@unusual_whales"
      account_credibility: "high (verified options flow tracker)"
      timestamp_utc: "2026-04-15 09:30:00"
      text: |
        BTC just broke $70K resistance with massive volume. Bulls in
