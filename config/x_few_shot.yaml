        the pattern strength warrants RISK_OFF.
      is_pre_event: false
      recommend_action: "Add every wallet in the Magamyman cluster to the watchlist and alert on future Iran/geopolitical markets."

  # ═════════════════════════════════════════════════════════════════
  # POSITIVE 5 — 2026-03-23 Oil short 16 min pre-event (Truth Social leak)
  # ═════════════════════════════════════════════════════════════════
